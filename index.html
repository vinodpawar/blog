<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog — Vinod Pawar</title>
<meta name="description" content="Notes on technology, systems, and things worth digging into.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f8;--ink:#0d1b3e;--muted:#4f5b7a;--line:#cdd4e6;--accent:#2a4bff;--soft:#e0e6f6;
--sans:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme=dark]{--bg:#0a1126;--ink:#e9edfb;--muted:#9aa6c9;--line:#212c52;--accent:#8ea6ff;--soft:#121b3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 var(--sans);padding-top:env(safe-area-inset-top,0)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 28px}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:26px;padding-bottom:10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.04em;text-decoration:none;color:var(--ink)}
nav{display:flex;align-items:center;gap:22px;font-size:16px;flex-wrap:wrap;justify-content:flex-end}
nav a{color:var(--muted);text-decoration:none}
nav a:hover,nav a[aria-current]{color:var(--accent)}
#theme{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px}
.hero{padding:64px 0 56px}
h1{font-size:clamp(64px,13vw,160px);line-height:.88;letter-spacing:-.055em;font-weight:800;margin:0}
h1 span{color:var(--accent)}
.tag{font-size:21px;color:var(--muted);margin:28px 0 0;max-width:22em}
section{border-top:1px solid var(--line);padding:48px 0}
section .wrap{display:grid;grid-template-columns:200px 1fr;gap:32px}
h2{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:600}
.post{display:block;text-decoration:none;color:var(--ink);background:var(--soft);border-radius:14px;padding:28px}
.post time{font:14px var(--mono);color:var(--muted)}
.post h3{margin:8px 0 8px;font-size:clamp(24px,3.4vw,34px);line-height:1.15;letter-spacing:-.03em}
.post p{margin:0;color:var(--muted)}
.post:hover h3{color:var(--accent)}
footer{border-top:1px solid var(--line);padding:32px 0 calc(56px + env(safe-area-inset-bottom,0));color:var(--muted);font-size:15px}
@media(max-width:820px){section .wrap{grid-template-columns:1fr;gap:16px}.hero{padding-top:40px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/">VP</a>
  <nav>
    <a href="/">Home</a><a href="/submeter">Apps</a><a href="/blog/" aria-current="page">Blog</a>
    <a href="https://github.com/vinodpawar">GitHub</a>
    <button id="theme" aria-label="Toggle light and dark theme">🌓</button>
  </nav>
</div></header>

<main>
<div class="wrap hero">
  <h1>Blog<span>.</span></h1>
  <p class="tag">My thoughts on technology, and what I learn along the way.</p>
</div>

<section><div class="wrap">
  <h2>Posts</h2>
  <div>
    <a class="post" href="/blog/ai-agents-getting-started.html">
      <time datetime="2026-09-28">28 September 2026</time>
      <h3>AI agents in simple words: what they are and how to start</h3>
      <p>What an AI agent really is, how it works, and how a boring monthly chore made me try one.</p>
    </a>
  </div>
</div></section>
</main>

<footer><div class="wrap">© <span id="y">2026</span> Vinod Pawar</div></footer>

<script>
var r=document.documentElement,s=null;
try{s=localStorage.getItem('theme')}catch(e){}
if(!s)s=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
r.dataset.theme=s;
document.getElementById('theme').onclick=function(){s=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=s;try{localStorage.setItem('theme',s)}catch(e){}};
document.getElementById('y').textContent=new Date().getFullYear();
</script>
</body>
</html>
